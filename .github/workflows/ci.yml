name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install
        run: npm ci

      - name: OKF tests
        run: npm run test:okf

      - name: Vault encryption tests
        run: npm run test:vault

      - name: MCP tests
        run: npm run test:mcp

      - name: Browser-secret tests
        run: npm run test:secrets

      - name: Version lockstep tests
        run: npm run test:version

      - name: Angular production build
        run: npm run build

      # Tauri desktop build is skipped here: not cheap or headless on this runner.
      # Draft Windows/Linux/macOS installers live in .github/workflows/release.yml
      # (workflow_dispatch / tag v* only). Do not upload people-graph fixtures or secrets.
