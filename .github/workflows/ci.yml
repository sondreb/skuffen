name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install
        run: npm ci

      - name: OKF tests
        run: npm run test:okf

      - name: Vault encryption tests
        run: npm run test:vault

      - name: MCP tests
        run: npm run test:mcp

      - name: Browser-secret tests
        run: npm run test:secrets

      - name: Grok OAuth device-flow tests
        run: npm run test:oauth

      - name: Research and follow (propose-only) tests
        run: npm run test:research

      - name: Duplicate-person merge (propose-only) tests
        run: npm run test:merge

      - name: Local pre-meeting brief (offline OKF) tests
        run: npm run test:brief

      - name: Voice capture (propose-only) tests
        run: npm run test:capture

      - name: Reconnect Shuffle (local, never auto-send) tests
        run: npm run test:shuffle

      - name: Person-card timeline (local memory tape) tests
        run: npm run test:timeline

      - name: GitHub update check (offline fixtures)
        run: npm run test:update

      - name: Version lockstep tests
        run: npm run test:version

      - name: Angular production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (headless, no video)
        run: E2E_DIST=1 npm run test:e2e

      # Tauri desktop build is skipped here: not cheap or headless on this runner.
      # Draft Windows/Linux/macOS installers live in .github/workflows/release.yml
      # (push to main bumps patch; workflow_dispatch is optional). Do not add a
      # desktop-release matrix to PR CI. Do not upload people-graph fixtures or secrets.
