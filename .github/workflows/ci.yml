name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install
        run: npm ci

      - name: OKF tests
        run: npm run test:okf

      - name: MCP tests
        run: npm run test:mcp

      - name: Browser-secret tests
        run: npm run test:secrets

      - name: Angular production build
        run: npm run build

      # Tauri desktop build is skipped: not cheap or headless on this runner.
      # Do not upload people-graph fixtures or any secret material.
