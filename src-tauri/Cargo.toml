[package]
name = "skuffen"
version = "0.1.45"
description = "Local-only personal intelligence. People-graph on disk as OKF."
authors = ["Sondre Bjellås"]
edition = "2021"
license = "MIT"
homepage = "https://skuffen.grok.me"
repository = "https://github.com/sondreb/skuffen"

[lib]
name = "skuffen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# keyring 3 has no default features. Without a platform store it uses an
# in-process mock: set_password succeeds on one Entry, get_password on the
# next Entry misses, and the 0600 file fallback is never written.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
walkdir = "2"
rfd = "0.15"
aes-gcm = "0.10"
